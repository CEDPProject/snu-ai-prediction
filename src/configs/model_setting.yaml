DLinear:
  moving_avg: 5
  individual: False

TimesNet:
  e_layers: 2
  d_model: 128
  d_ff: 512
  num_kernels: 5
  dropout: 0.1
  top_k: 1
  embed: learned
  freq: h

PatchTST:
  e_layers: 2
  d_model: 128
  d_ff: 512
  dropout: 0.1
  embed: learned
  freq: h
  factor: 3
  n_heads: 8
  activation: gelu
  patch_len: 16
  stride: 8

iTransformer:
  e_layers: 2
  d_model: 128
  d_ff: 512
  dropout: 0.1
  embed: learned
  freq: h
  factor: 3
  n_heads: 8
  activation: gelu

NCART:
  n_features: 128
  n_selected: 8
  n_out: 1
  n_trees: 32
  n_layers: 4
  mask_type: sparsemax

TabM:
  cat_cardinalities: []        # 범주형 변수의 cardinalities (예: [5, 10, 3] 등)
  n_classes: null              # 분류 문제일 경우 클래스 수 (예: 2 또는 10), 회귀일 경우 null
  backbone:
    type: MLP
    n_blocks: 3
    d_block: 512
    dropout: 0.1
    d_out: null
  bins: null
  num_embeddings: null
  n_out: 1
  arch_type: tabm              # TabM 모델 구조
  k: 32                        # Adapters에서 top-k 선택 수 (핵심!)
  share_training_batches: true # 학습 배치 공유 여부 (보통 True)

############# ML Models #############

MLModelEnsemble:
  selected_models: svr dt rf
  ridge_alpha: 1.0
  rf_n_estimators: 100
  rf_max_depth: 10
  svr_kernel: rbf
  svr_C: 1.0
  dt_max_depth: 10

MLpycaret:
  selected_models: ['rf', 'et', 'gbr', 'lightgbm']
  enable_tuning: False
  tuning_iter: 10
  optimize_metric: 'MAE'
  search_library: 'scikit-learn'
  search_algorithm: 'grid'
  early_stopping: False
  n_jobs: 3
  k_fold_num: 5
  ensemble:
    enable: True,  # PyCaret 앙상블 활성화
    types: ['blend', 'stack', 'bagging']  # 사용할 PyCaret 앙상블
  model_grids:
    svm:  # Support Vector Machine
      C: [0.1, 1, 10]
      kernel: ['linear', 'rbf']
      gamma: ['scale', 'auto']
    dt:  # Decision Tree
      max_depth: [None, 10, 20, 30]
      min_samples_split: [2, 5, 10]
      min_samples_leaf: [1, 2, 4]
    lr:  # Linear Regression
      fit_intercept: [True, False]
    ridge:  # Ridge Regression
      alpha: [0.1, 1, 10]
      fit_intercept: [True, False]
      solver: ['auto', 'svd', 'cholesky', 'saga']
    br:  # Bayesian Ridge Regression
      alpha_1: [1e-6, 1e-5, 1e-4]
      alpha_2: [1e-6, 1e-5, 1e-4]
      lambda_1: [1e-6, 1e-5, 1e-4]
      lambda_2: [1e-6, 1e-5, 1e-4]
    huber:  # Huber Regression
      alpha: [0.0001, 0.001, 0.01]
      epsilon: [1.1, 1.35, 1.5]
    rf:
      n_estimators: [200, 300, 500]     # 성능에 가장 큰 영향
      max_depth: [20, 30, 40]         # 과적합 vs 성능 균형
    et:
      n_estimators: [200, 300, 500]     # 성능에 가장 큰 영향
      max_depth: [20, 30, 40]         # 과적합 vs 성능 균형
    gbr:
      n_estimators: [200, 300, 500]     # 부스팅 라운드 수 (가장 중요)
      learning_rate: [0.05, 0.1, 0.15]  # 학습률 (두 번째로 중요)
      max_depth: [3, 5, 7]              # 트리 깊이 (세 번째로 중요)
    lightgbm:
      num_leaves: [31, 63, 127]         # 모델 복잡도 (가장 중요)
      learning_rate: [0.05, 0.1, 0.15]  # 학습률 (두 번째로 중요)
      n_estimators: [200, 300, 500]     # 부스팅 라운드 (세 번째로 중요)

    # rf:
