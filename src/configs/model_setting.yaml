TemporalFusionTransformer:
  input_feature_num: 1
  gmlp_depth: 3
  attention_together: True
  RNN_type: GRU

MLModelEnsemble:
  selected_models: svr dt rf
  ridge_alpha: 1.0
  rf_n_estimators: 100
  rf_max_depth: 10
  svr_kernel: rbf
  svr_C: 1.0
  dt_max_depth: 10

MLpycaret:
  selected_models: ['gbr', 'lightgbm']
  enable_tuning: True
  tuning_iter: 10
  optimize_metric: 'MSE'
  search_library: 'scikit-learn'
  search_algorithm: 'grid'
  early_stopping: False
  n_jobs: 5
  k_fold_num: 5
  model_grids:
    svm:  # Support Vector Machine
      C: [0.1, 1, 10]
      kernel: ['linear', 'rbf']
      gamma: ['scale', 'auto']
    dt:  # Decision Tree
      max_depth: [None, 10, 20, 30]
      min_samples_split: [2, 5, 10]
      min_samples_leaf: [1, 2, 4]
    lr:  # Linear Regression
      fit_intercept: [True, False]
    ridge:  # Ridge Regression
      alpha: [0.1, 1, 10]
      fit_intercept: [True, False]
      solver: ['auto', 'svd', 'cholesky', 'saga']
    br:  # Bayesian Ridge Regression
      alpha_1: [1e-6, 1e-5, 1e-4]
      alpha_2: [1e-6, 1e-5, 1e-4]
      lambda_1: [1e-6, 1e-5, 1e-4]
      lambda_2: [1e-6, 1e-5, 1e-4]
    huber:  # Huber Regression
      alpha: [0.0001, 0.001, 0.01]
      epsilon: [1.1, 1.35, 1.5]
    rf:  # Random Forest
      n_estimators: [300, 400]
      max_depth: [30, 40]
      min_samples_split: [5, 7]
      min_samples_leaf: [1, 3]
    et:  # Extra Trees
      n_estimators: [300, 400]
      max_depth: [30, 40]
      min_samples_split: [5, 7]
      min_samples_leaf: [1, 3]
    gbr:  # Gradient Boosting Regressor
      n_estimators: [300, 400]
      learning_rate: [0.1, 0.2]
      max_depth: [5, 7]
      min_samples_split: [2]
    lightgbm:  # LightGBM
      num_leaves: [62, 127]
      learning_rate: [0.1, 0.2]
      n_estimators: [300, 400]

