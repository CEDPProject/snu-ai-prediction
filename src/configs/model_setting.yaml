TemporalFusionTransformer:
  input_feature_num: 1
  gmlp_depth: 3
  attention_together: True
  RNN_type: GRU

MLModelEnsemble:
  selected_models: svr dt rf
  ridge_alpha: 1.0
  rf_n_estimators: 100
  rf_max_depth: 10
  svr_kernel: rbf
  svr_C: 1.0
  dt_max_depth: 10

MLpycaret:
  selected_models: ['ridge']
  enable_tuning: True
  tuning_iter: 2
  optimize_metric: 'MSE'
  search_library: 'optuna'

