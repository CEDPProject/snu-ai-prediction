DEFAULT:
  exp_name: power_generation_prediction
  seed: 42
  del_pt: False

DATASET:
  datadir: ../../data/ecobrain  # src/ 기준 경로. <datadir>/<data_version>/{태양광발전단지,풍력발전단지}/
  scale: standard
  split_rate: [0.8, 0.0, 0.1]
  split_date: 2023-01-01 00:00:00
  end_date: 2023-12-31 23:00:00  
  # end_date: 2023-12-31 23:00:00  
  batch_size: 64
  num_workers: 0
  shuffle: false
  pin_memory: true
  drop_last: false
  category_name: wind
  data_version: version2_241107
  input_structure: independence
  individual_model: True
  align_time: False
  lead_time_align: True
  target: power
  target_type: multi
  seq_len: 12
  pred_len: 1
  c_out: 1
  ignore_feature: ['LEAD_TM', 'NWP_TP_CD']
  # ['LEAD_TM', 'NWP_TP_CD']

TRAIN:
  epoch: 30
  ckp_metric: loss
  eval_epochs: 1
  log_epochs: 1
  log_eval_iter: 100
  early_stopping_count: 5
  resume: null
  pre_training: false
  data_num: 0
  fine_tuning_method: full
  grad_accum_steps: 1
  mixed_precision: 'no'
  clamping: True
  return_output: True
  wandb: 
    use: false
    wandb_iter: 500
    exp_name: default
    project_name: 'power_generation_prediction'
    entity: null  # wandb 계정/팀 이름 (use: true일 때 지정)
LOSS:
  loss_name: mse

OPTIMIZER:
  opt_name: adamw
  lr: 0.0001
  params:
    weight_decay: 0.0005

RESULT:
  savedir: './saved_model'
