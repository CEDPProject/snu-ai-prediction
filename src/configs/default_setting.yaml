DEFAULT:
  exp_name: KETI_weather_prediction
  seed: 42

DATASET:
  datadir: ../data
  scale: standard
  split_rate: [0.8, 0.1, 0.1]
  batch_size: 128
  num_workers: 0
  shuffle: true
  pin_memory: true
  drop_last: true
  category_name: solar
  data_version: version2_241107
  input_structure: independence
  align_time: False
  lead_time_align: False

TRAIN:
  epoch: 25
  ckp_metric: loss
  eval_epochs: 1
  log_epochs: 1
  log_eval_iter: 100
  early_stopping_count: 5
  resume: null
  pre_training: false
  data_num: 0
  fine_tuning_method: full
  grad_accum_steps: 1
  mixed_precision: fp16
  wandb: 
    use: false
    wandb_iter: 500
    exp_name: default
    project_name: 'KETI_weather_prediction'
    entity: null
LOSS:
  loss_name: mse

OPTIMIZER:
  opt_name: adamw
  lr: 0.0001
  params:
    weight_decay: 0.0005

RESULT:
  savedir: './saved_model'